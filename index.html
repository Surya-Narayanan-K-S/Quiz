<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>voltEdge · Decentralized Generation & Rural Electrification Quiz Portal</title>
    <meta name="description" content="voltEdge — Next-Gen Academic Assessment Portal for Course 20EE2E41: Rural Electrification – Technology and Economics, Department of EEE, Sri Ramakrishna Engineering College.">
    
    <!-- Modern Google Fonts: Outfit, Plus Jakarta Sans, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Mammoth.js for Word (.docx) Document Parsing in Browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

    <!-- Supabase JS Client for Cloud Database Integration -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* ==========================================================================
           ULTRA-MODERN DESIGN SYSTEM & DESIGN TOKENS
           ========================================================================== */
        :root {
            --font-head: 'Outfit', -apple-system, system-ui, sans-serif;
            --font-sans: 'Plus Jakarta Sans', -apple-system, system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;

            /* Deep Obsidian Cyber-Grid Palette */
            --bg: #040711;
            --bg-elevated: #090e1e;
            --bg-card: rgba(12, 19, 38, 0.75);
            --bg-card-hover: rgba(18, 29, 58, 0.88);
            --bg-glass: rgba(14, 23, 48, 0.65);
            --bg-glass-strong: rgba(17, 28, 59, 0.88);
            
            --ink: #f8fafc;
            --ink-dim: #94a3b8;
            --ink-muted: #64748b;
            
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.18);
            --border-focus: rgba(255, 183, 3, 0.6);
            --border-glow: rgba(0, 242, 254, 0.35);

            /* Radiant Accents */
            --gold: #ffb703;
            --gold-glow: rgba(255, 183, 3, 0.3);
            --orange: #fb8500;
            --gradient-gold: linear-gradient(135deg, #ffb703 0%, #fb8500 100%);
            
            --cyan: #00f2fe;
            --cyan-glow: rgba(0, 242, 254, 0.28);
            --blue: #4facfe;
            --gradient-cyan: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            
            --purple: #8b5cf6;
            --purple-glow: rgba(139, 92, 246, 0.28);
            --gradient-purple: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);

            --ok: #10b981;
            --ok-light: #34d399;
            --ok-bg: rgba(16, 185, 129, 0.14);
            --ok-border: rgba(16, 185, 129, 0.45);

            --bad: #ff0055;
            --bad-light: #ff4d88;
            --bad-bg: rgba(255, 0, 85, 0.14);
            --bad-border: rgba(255, 0, 85, 0.45);

            /* Shadows & Radii */
            --shadow-subtle: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            --shadow-card: 0 24px 50px -12px rgba(0, 0, 0, 0.65), 0 0 0 1px var(--border);
            --shadow-glow: 0 20px 60px -10px rgba(0, 242, 254, 0.25), 0 0 20px rgba(255, 183, 3, 0.2);
            --shadow-pop: 0 30px 70px -15px rgba(0, 0, 0, 0.8), 0 0 35px rgba(255, 183, 3, 0.35);

            --r-sm: 10px;
            --r-md: 16px;
            --r-lg: 24px;
            --r-full: 9999px;

            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
            --t-fast: all 0.2s var(--ease-out);
            --t-med: all 0.35s var(--ease-out);
        }

        [data-theme="light"] {
            --bg: #f8fafc;
            --bg-elevated: #ffffff;
            --bg-card: rgba(255, 255, 255, 0.85);
            --bg-card-hover: rgba(248, 250, 252, 0.95);
            --bg-glass: rgba(255, 255, 255, 0.75);
            --bg-glass-strong: rgba(255, 255, 255, 0.95);
            
            --ink: #0f172a;
            --ink-dim: #475569;
            --ink-muted: #94a3b8;
            
            --border: rgba(15, 23, 42, 0.08);
            --border-hover: rgba(15, 23, 42, 0.18);
            --border-focus: rgba(217, 119, 6, 0.6);
            --border-glow: rgba(2, 132, 199, 0.3);

            --gold: #d97706;
            --gold-glow: rgba(217, 119, 6, 0.2);
            --orange: #ea580c;
            
            --cyan: #0284c7;
            --cyan-glow: rgba(2, 132, 199, 0.2);
            
            --ok: #059669;
            --ok-light: #10b981;
            --ok-bg: rgba(5, 150, 105, 0.08);
            --ok-border: rgba(5, 150, 105, 0.35);

            --bad: #e11d48;
            --bad-light: #f43f5e;
            --bad-bg: rgba(225, 29, 72, 0.08);
            --bad-border: rgba(225, 29, 72, 0.35);

            --shadow-card: 0 20px 45px -12px rgba(15, 23, 42, 0.08), 0 0 0 1px var(--border);
            --shadow-glow: 0 20px 50px -10px rgba(15, 23, 42, 0.12), 0 0 20px rgba(217, 119, 6, 0.15);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg);
            color: var(--ink);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            padding-bottom: env(safe-area-inset-bottom);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Ambient Aurora Background Particles & Glowing Mesh */
        .cyber-universe {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .aurora-sphere {
            position: absolute;
            border-radius: 50%;
            filter: blur(140px);
            opacity: 0.32;
            pointer-events: none;
        }

        .sphere-1 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #ffb703 0%, rgba(251, 133, 0, 0.2) 70%, transparent 100%);
            top: -200px;
            left: 10%;
            animation: auroraWander1 22s infinite alternate ease-in-out;
        }

        .sphere-2 {
            width: 650px;
            height: 650px;
            background: radial-gradient(circle, #00f2fe 0%, rgba(79, 172, 254, 0.25) 70%, transparent 100%);
            bottom: -150px;
            right: 5%;
            animation: auroraWander2 18s infinite alternate-reverse ease-in-out;
        }

        .sphere-3 {
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, #8b5cf6 0%, rgba(139, 92, 246, 0.2) 70%, transparent 100%);
            top: 40%;
            left: 45%;
            opacity: 0.18;
            animation: auroraWander1 26s infinite alternate ease-in-out;
        }

        @keyframes auroraWander1 {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(60px, 40px) scale(1.12); }
            100% { transform: translate(-40px, -30px) scale(0.92); }
        }

        @keyframes auroraWander2 {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-50px, -40px) scale(1.08); }
            100% { transform: translate(40px, 30px) scale(0.95); }
        }

        /* High-Tech Circuit Grid Background */
        .circuit-grid {
            position: fixed;
            inset: 0;
            z-index: 0;
            opacity: 0.22;
            background-image: 
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 54px 54px;
            background-position: center center;
            mask-image: radial-gradient(circle at 50% 30%, black 50%, transparent 90%);
            -webkit-mask-image: radial-gradient(circle at 50% 30%, black 50%, transparent 90%);
            pointer-events: none;
        }

        /* Navigation Header */
        header.nav-hud {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: color-mix(in srgb, var(--bg) 80%, transparent);
            border-bottom: 1px solid var(--border);
            padding: 14px 28px;
            padding-top: calc(14px + env(safe-area-inset-top));
            transition: var(--t-fast);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .brand-link {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            color: inherit;
        }

        .brand-logo-ring {
            position: relative;
            width: 44px;
            height: 44px;
            border-radius: var(--r-md);
            background: var(--gradient-gold);
            display: grid;
            place-items: center;
            box-shadow: 0 0 20px var(--gold-glow);
            transition: var(--t-fast);
            flex-shrink: 0;
        }

        .brand-logo-ring:hover {
            transform: scale(1.05);
        }

        .brand-text-block {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .brand-title-text {
            font-family: var(--font-head);
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-course-chip {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: var(--r-full);
            background: var(--gold-glow);
            color: var(--gold);
            border: 1px solid var(--gold);
            letter-spacing: 0.04em;
        }

        .brand-sub-text {
            font-size: 0.76rem;
            color: var(--ink-dim);
            font-weight: 500;
            letter-spacing: 0.01em;
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Buttons Core */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: var(--font-head);
            font-size: 0.9rem;
            font-weight: 700;
            padding: 12px 22px;
            border-radius: var(--r-md);
            cursor: pointer;
            border: 1px solid transparent;
            transition: var(--t-fast);
            text-decoration: none;
            user-select: none;
            outline: none;
            white-space: nowrap;
            position: relative;
            overflow: hidden;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        .btn:focus-visible {
            box-shadow: 0 0 0 3px var(--border-focus);
        }

        .btn-primary {
            background: var(--gradient-gold);
            color: #120900;
            box-shadow: 0 6px 25px var(--gold-glow);
            letter-spacing: 0.01em;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 32px rgba(255, 183, 3, 0.45);
            filter: brightness(1.06);
        }

        .btn-primary:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--ink);
            border-color: var(--border);
            backdrop-filter: blur(12px);
        }

        .btn-secondary:hover:not(:disabled) {
            background: var(--bg-card-hover);
            border-color: var(--border-hover);
            transform: translateY(-1px);
        }

        .btn-cyber {
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.15) 0%, rgba(79, 172, 254, 0.25) 100%);
            color: var(--cyan);
            border: 1px solid var(--cyan);
            box-shadow: 0 0 20px var(--cyan-glow);
        }

        .btn-cyber:hover:not(:disabled) {
            background: var(--gradient-cyan);
            color: #040711;
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.5);
        }

        .btn-icon {
            width: 42px;
            height: 42px;
            padding: 0;
            border-radius: var(--r-md);
            background: var(--bg-card);
            color: var(--ink-dim);
            border: 1px solid var(--border);
            backdrop-filter: blur(12px);
        }

        .btn-icon:hover {
            color: var(--ink);
            border-color: var(--border-hover);
            background: var(--bg-card-hover);
            transform: scale(1.04);
        }

        .btn-sm {
            padding: 8px 14px;
            font-size: 0.82rem;
            border-radius: var(--r-sm);
        }

        /* App Wrapper */
        main.main-viewport {
            position: relative;
            z-index: 10;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 28px 22px 54px;
            flex: 1;
        }

        /* Futuristic Card Component */
        .cyber-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--r-lg);
            padding: 32px;
            box-shadow: var(--shadow-card);
            transition: var(--t-med);
            animation: cardElevate 0.5s var(--ease-out) both;
            position: relative;
            overflow: hidden;
        }

        .cyber-card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1.5px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.16) 0%, transparent 45%, rgba(0, 242, 254, 0.25) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        @keyframes cardElevate {
            from {
                opacity: 0;
                transform: translateY(24px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Hero Stage */
        .hero-stage {
            display: grid;
            grid-template-columns: 1.15fr 0.95fr;
            gap: 36px;
            align-items: center;
            margin-bottom: 28px;
        }

        .hero-content {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .hero-live-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            border-radius: var(--r-full);
            background: rgba(255, 183, 3, 0.12);
            color: var(--gold);
            border: 1px solid var(--gold);
            font-family: var(--font-mono);
            font-size: 0.78rem;
            font-weight: 700;
            width: fit-content;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .pulsing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--gold);
            box-shadow: 0 0 10px var(--gold);
            animation: pulseGlow 1.8s infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        .hero-headline {
            font-family: var(--font-head);
            font-size: 2.85rem;
            font-weight: 900;
            line-height: 1.12;
            letter-spacing: -0.03em;
        }

        .hero-headline em {
            font-style: normal;
            background: linear-gradient(135deg, #ffb703 10%, #00f2fe 90%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-block;
        }

        .hero-description {
            color: var(--ink-dim);
            font-size: 1rem;
            line-height: 1.65;
            max-width: 540px;
        }

        /* Student Entrance Form */
        .student-gateway-form {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            padding: 22px;
            margin-top: 4px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: var(--shadow-subtle);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-prefix-icon {
            position: absolute;
            left: 15px;
            color: var(--ink-muted);
            pointer-events: none;
            display: flex;
            align-items: center;
        }

        .cyber-input {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--r-sm);
            padding: 14px 16px 14px 48px;
            color: var(--ink);
            font-family: var(--font-sans);
            font-size: 0.96rem;
            outline: none;
            transition: var(--t-fast);
        }

        .cyber-input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px var(--gold-glow);
            background: var(--bg-elevated);
        }

        .cyber-input::placeholder {
            color: var(--ink-muted);
        }

        /* Real Image Showcase Container */
        .showcase-visual-frame {
            position: relative;
            border-radius: var(--r-lg);
            overflow: hidden;
            border: 1px solid var(--border-hover);
            box-shadow: var(--shadow-pop);
            background: #060b17;
            height: 100%;
            min-height: 420px;
            display: flex;
            flex-direction: column;
        }

        .showcase-real-image {
            width: 100%;
            height: 100%;
            min-height: 420px;
            object-fit: cover;
            display: block;
            transition: transform 0.8s var(--ease-out);
        }

        .showcase-visual-frame:hover .showcase-real-image {
            transform: scale(1.04);
        }

        .showcase-glass-hud {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(4, 7, 17, 0.1) 0%, rgba(4, 7, 17, 0.45) 50%, rgba(4, 7, 17, 0.94) 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 26px;
            pointer-events: none;
        }

        .hud-chip {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: rgba(9, 14, 30, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 242, 254, 0.4);
            color: var(--cyan);
            font-family: var(--font-mono);
            font-size: 0.74rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: var(--r-full);
            width: fit-content;
            margin-bottom: 8px;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
        }

        .hud-title {
            font-family: var(--font-head);
            font-size: 1.25rem;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.3;
        }

        .hud-subtitle {
            font-size: 0.82rem;
            color: #94a3b8;
            margin-top: 4px;
        }

        /* Feature Matrix Grid */
        .feature-matrix {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 28px;
        }

        .matrix-tile {
            background: var(--bg-card);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            padding: 22px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: var(--t-fast);
        }

        .matrix-tile:hover {
            transform: translateY(-3px);
            border-color: var(--border-hover);
            box-shadow: var(--shadow-card);
        }

        .tile-icon-hex {
            width: 48px;
            height: 48px;
            border-radius: var(--r-sm);
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            display: grid;
            place-items: center;
            font-size: 1.4rem;
            flex-shrink: 0;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
        }

        .matrix-tile b {
            display: block;
            font-family: var(--font-head);
            font-size: 1.45rem;
            font-weight: 900;
            color: var(--ink);
            line-height: 1.1;
        }

        .matrix-tile span {
            font-size: 0.82rem;
            color: var(--ink-dim);
            font-weight: 600;
        }

        /* Quiz Mission HUD Layout */
        .quiz-hud-layout {
            display: grid;
            grid-template-columns: 310px 1fr;
            gap: 24px;
            align-items: start;
        }

        /* Left Sidebar Mission HUD */
        .telemetry-sidebar {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .telemetry-profile {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px;
            background: var(--bg-elevated);
            border-radius: var(--r-md);
            border: 1px solid var(--border);
        }

        .profile-avatar-node {
            width: 44px;
            height: 44px;
            border-radius: var(--r-full);
            background: var(--cyan-glow);
            color: var(--cyan);
            border: 1.5px solid var(--cyan);
            display: grid;
            place-items: center;
            font-family: var(--font-head);
            font-weight: 800;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .profile-text-node {
            overflow: hidden;
        }

        .profile-text-node b {
            display: block;
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .profile-text-node span {
            font-family: var(--font-mono);
            font-size: 0.76rem;
            color: var(--ink-dim);
            display: block;
        }

        .telemetry-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background: var(--bg-elevated);
            border-radius: var(--r-sm);
            border: 1px solid var(--border);
            font-size: 0.88rem;
            color: var(--ink-dim);
        }

        .telemetry-row b {
            font-family: var(--font-mono);
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--gold);
        }

        .streak-fire-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: #ff5722 !important;
            animation: pulseFire 1.5s infinite ease-in-out;
        }

        @keyframes pulseFire {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px #ff5722); }
            50% { transform: scale(1.12); filter: drop-shadow(0 0 10px #ff5722); }
        }

        .mission-progress-bar {
            height: 10px;
            background: var(--bg-elevated);
            border-radius: var(--r-full);
            overflow: hidden;
            border: 1px solid var(--border);
            position: relative;
        }

        .mission-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ffb703, #00f2fe);
            border-radius: var(--r-full);
            transition: width 0.4s var(--ease-out);
            position: relative;
        }

        .mission-progress-fill::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
            animation: shineBar 1.6s infinite;
        }

        @keyframes shineBar {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* Matrix Dots Indicator */
        .matrix-dots-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-top: 6px;
        }

        .matrix-dot {
            height: 34px;
            border-radius: var(--r-sm);
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            color: var(--ink-dim);
            font-family: var(--font-mono);
            font-size: 0.82rem;
            font-weight: 700;
            display: grid;
            place-items: center;
            transition: var(--t-fast);
        }

        .matrix-dot.cur {
            background: var(--bg-card-hover);
            border-color: var(--gold);
            color: var(--gold);
            box-shadow: 0 0 14px var(--gold-glow);
            transform: scale(1.08);
        }

        .matrix-dot.ok {
            background: var(--ok-bg);
            border-color: var(--ok-border);
            color: var(--ok-light);
            font-weight: 800;
        }

        .matrix-dot.bad {
            background: var(--bad-bg);
            border-color: var(--bad-border);
            color: var(--bad-light);
            font-weight: 800;
        }

        /* Question Command Stage */
        .question-stage-card {
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        /* Cyber Countdown Gauge Bar */
        .gauge-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .gauge-telemetry {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.84rem;
            font-weight: 700;
        }

        .unit-topic-tag {
            font-family: var(--font-mono);
            font-size: 0.74rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--cyan);
            background: var(--cyan-glow);
            border: 1px solid var(--cyan);
            padding: 3px 10px;
            border-radius: var(--r-full);
        }

        .timer-digital-readout {
            font-family: var(--font-mono);
            font-size: 0.92rem;
            font-weight: 800;
            color: var(--cyan);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .gauge-track {
            height: 9px;
            background: var(--bg-elevated);
            border-radius: var(--r-full);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .gauge-energy-bar {
            height: 100%;
            width: 100%;
            background: var(--gradient-cyan);
            border-radius: var(--r-full);
            transition: width 0.1s linear, background-color 0.3s ease;
        }

        .gauge-energy-bar.critical {
            background: linear-gradient(90deg, #ff0055, #ff4d88) !important;
            animation: pulseCritical 0.65s infinite;
        }

        @keyframes pulseCritical {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.55; }
        }

        .question-prompt-text {
            font-family: var(--font-head);
            font-size: 1.45rem;
            font-weight: 800;
            line-height: 1.4;
            color: var(--ink);
            letter-spacing: -0.01em;
        }

        /* Option Cyber Cards */
        .options-deck {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .opt-card-btn {
            display: flex;
            align-items: center;
            gap: 18px;
            width: 100%;
            text-align: left;
            background: var(--bg-elevated);
            color: var(--ink);
            border: 1.5px solid var(--border);
            border-radius: var(--r-md);
            padding: 18px 22px;
            font-family: var(--font-sans);
            font-size: 0.98rem;
            cursor: pointer;
            transition: var(--t-fast);
            position: relative;
            outline: none;
        }

        .opt-card-btn:hover:not(:disabled) {
            transform: translateX(8px);
            border-color: var(--gold);
            background: var(--bg-card-hover);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .opt-card-btn:focus-visible {
            box-shadow: 0 0 0 3px var(--gold-glow);
        }

        .opt-key-hex {
            width: 42px;
            height: 42px;
            border-radius: var(--r-sm);
            background: var(--bg);
            border: 1px solid var(--border-hover);
            display: grid;
            place-items: center;
            font-family: var(--font-mono);
            font-size: 1.05rem;
            font-weight: 800;
            flex-shrink: 0;
            transition: var(--t-fast);
            color: var(--ink-dim);
        }

        .opt-text-payload {
            flex: 1;
            line-height: 1.45;
        }

        .opt-card-btn.ok {
            border-color: var(--ok);
            background: var(--ok-bg);
            box-shadow: 0 0 25px var(--ok-bg);
        }

        .opt-card-btn.ok .opt-key-hex {
            background: var(--ok);
            color: #ffffff;
            border-color: var(--ok);
        }

        .opt-card-btn.bad {
            border-color: var(--bad);
            background: var(--bad-bg);
            animation: shake 0.4s ease-in-out;
        }

        .opt-card-btn.bad .opt-key-hex {
            background: var(--bad);
            color: #ffffff;
            border-color: var(--bad);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-9px); }
            40%, 80% { transform: translateX(9px); }
        }

        /* Action Feedback Bar */
        .stage-footer-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
            margin-top: 4px;
        }

        .feedback-banner {
            font-size: 0.98rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .feedback-banner.good {
            color: var(--ok-light);
        }

        .feedback-banner.wrong {
            color: var(--bad-light);
        }

        /* Results Final Stage */
        .results-grand-card {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 46px 28px;
        }

        .gauge-score-circle {
            position: relative;
            width: 150px;
            height: 150px;
            display: grid;
            place-items: center;
            margin: 8px auto;
        }

        .gauge-svg-ring {
            position: absolute;
            inset: 0;
            transform: rotate(-90deg);
        }

        .gauge-bg-ring {
            fill: none;
            stroke: var(--border-hover);
            stroke-width: 9;
        }

        .gauge-val-ring {
            fill: none;
            stroke: var(--gold);
            stroke-width: 9;
            stroke-linecap: round;
            stroke-dasharray: 377;
            stroke-dashoffset: 377;
            transition: stroke-dashoffset 1.4s var(--ease-out);
        }

        .gauge-numeric {
            font-family: var(--font-head);
            font-size: 3.2rem;
            font-weight: 900;
            color: var(--ink);
            line-height: 1;
        }

        .gauge-denom {
            font-family: var(--font-mono);
            font-size: 0.86rem;
            color: var(--ink-dim);
            font-weight: 700;
        }

        .rank-banner-title {
            font-family: var(--font-head);
            font-size: 1.85rem;
            font-weight: 900;
            color: var(--gold);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .kpi-matrix-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            width: 100%;
            max-width: 860px;
            margin: 10px 0;
        }

        .kpi-tile-unit {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            padding: 18px 14px;
            text-align: center;
        }

        .kpi-tile-unit b {
            display: block;
            font-family: var(--font-head);
            font-size: 1.85rem;
            font-weight: 900;
            color: var(--ink);
        }

        .kpi-tile-unit span {
            font-size: 0.8rem;
            color: var(--ink-dim);
            font-weight: 600;
        }

        /* Review Section */
        .syllabus-review-card {
            margin-top: 28px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .review-question-strip {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-left: 6px solid var(--border);
            border-radius: var(--r-md);
            padding: 18px 22px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 0.94rem;
        }

        .review-question-strip.ok {
            border-left-color: var(--ok);
        }

        .review-question-strip.bad {
            border-left-color: var(--bad);
        }

        .review-q-text {
            font-weight: 700;
            color: var(--ink);
            font-family: var(--font-head);
            font-size: 1.05rem;
        }

        .review-answers-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            font-size: 0.88rem;
        }

        .review-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: var(--r-sm);
            font-weight: 700;
        }

        .pill-ok {
            background: var(--ok-bg);
            color: var(--ok-light);
            border: 1px solid var(--ok-border);
        }

        .pill-bad {
            background: var(--bad-bg);
            color: var(--bad-light);
            border: 1px solid var(--bad-border);
        }

        /* Teacher Portal Navigation Tabs */
        .tabs-header-bar {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            border-bottom: 1px solid var(--border);
            padding-bottom: 14px;
            overflow-x: auto;
        }

        .tab-button-nav {
            background: transparent;
            color: var(--ink-dim);
            border: 1px solid transparent;
            padding: 10px 20px;
            border-radius: var(--r-full);
            font-family: var(--font-head);
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--t-fast);
            white-space: nowrap;
        }

        .tab-button-nav:hover {
            color: var(--ink);
            background: var(--bg-card-hover);
        }

        .tab-button-nav.active {
            background: var(--gold);
            color: #120900;
            border-color: var(--gold);
            font-weight: 800;
            box-shadow: 0 0 20px var(--gold-glow);
        }

        /* Histogram Visualizer */
        .chart-visual-box {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            padding: 26px 22px 36px;
            margin-bottom: 26px;
        }

        .histogram-flex-frame {
            display: flex;
            align-items: flex-end;
            gap: 16px;
            height: 140px;
            padding-top: 10px;
        }

        .hist-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            justify-content: flex-end;
            position: relative;
        }

        .hist-tower {
            width: 100%;
            max-width: 60px;
            background: var(--gradient-cyan);
            border-radius: 8px 8px 0 0;
            min-height: 4px;
            transition: height 0.6s var(--ease-out);
            position: relative;
            box-shadow: 0 4px 16px var(--cyan-glow);
        }

        .hist-tower-val {
            position: absolute;
            top: -24px;
            left: 0;
            right: 0;
            text-align: center;
            font-family: var(--font-mono);
            font-size: 0.78rem;
            font-weight: 800;
            color: var(--cyan);
        }

        .hist-tower-label {
            position: absolute;
            bottom: -24px;
            left: 0;
            right: 0;
            text-align: center;
            font-family: var(--font-mono);
            font-size: 0.74rem;
            color: var(--ink-dim);
            white-space: nowrap;
        }

        /* Modern Table */
        .table-glass-wrap {
            overflow-x: auto;
            border-radius: var(--r-md);
            border: 1px solid var(--border);
            background: var(--bg-elevated);
        }

        table.cyber-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            text-align: left;
        }

        table.cyber-table th {
            background: var(--bg);
            padding: 14px 18px;
            font-family: var(--font-head);
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--ink-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        table.cyber-table td {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            color: var(--ink);
            white-space: nowrap;
        }

        table.cyber-table tr:last-child td {
            border-bottom: none;
        }

        table.cyber-table tr:hover td {
            background: var(--bg-card-hover);
        }

        /* Question Editor & Word .docx Dropzone */
        .dropzone-cyber-box {
            border: 2px dashed var(--border-hover);
            background: var(--bg-elevated);
            border-radius: var(--r-md);
            padding: 40px 24px;
            text-align: center;
            cursor: pointer;
            transition: var(--t-fast);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 22px;
        }

        .dropzone-cyber-box:hover, .dropzone-cyber-box.dragover {
            border-color: var(--gold);
            background: var(--bg-card-hover);
            box-shadow: 0 0 25px var(--gold-glow);
        }

        .dropzone-icon-orb {
            width: 60px;
            height: 60px;
            border-radius: var(--r-full);
            background: var(--gold-glow);
            color: var(--gold);
            display: grid;
            place-items: center;
            box-shadow: 0 0 15px var(--gold-glow);
        }

        .doc-staging-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 22px;
        }

        .doc-staged-card {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            padding: 18px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Toast HUD */
        #toast {
            position: fixed;
            bottom: calc(26px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%) translateY(24px);
            background: var(--bg-elevated);
            color: var(--ink);
            border: 1px solid var(--gold);
            padding: 13px 26px;
            border-radius: var(--r-full);
            z-index: 200;
            box-shadow: var(--shadow-pop);
            font-family: var(--font-head);
            font-size: 0.92rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s var(--ease-out);
        }

        #toast.on {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Confetti Pieces */
        .confetti-piece {
            position: fixed;
            top: -14px;
            width: 10px;
            height: 14px;
            animation: fallPhysics 2.8s linear forwards;
            z-index: 99;
            border-radius: 2px;
        }

        @keyframes fallPhysics {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
        }

        /* Footer */
        footer.cyber-footer {
            margin-top: auto;
            border-top: 1px solid var(--border);
            padding: 24px 28px;
            text-align: center;
            color: var(--ink-dim);
            font-size: 0.84rem;
            position: relative;
            z-index: 10;
        }

        .footer-hud-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        /* ==========================================================================
           COMPREHENSIVE RESPONSIVE DESIGN (TABLETS & MOBILE PHONES)
           ========================================================================== */
        * {
            -webkit-tap-highlight-color: transparent;
        }

        button, input, select, textarea, .btn, .opt-card-btn, .tab-button-nav {
            touch-action: manipulation;
        }

        @media (max-width: 900px) {
            .hero-stage {
                grid-template-columns: 1fr;
                gap: 24px;
                padding: 28px 24px;
            }
            .hero-headline {
                font-size: 2.1rem;
            }
            .quiz-hud-layout {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            .telemetry-sidebar {
                order: 2;
            }
            .feature-matrix {
                grid-template-columns: repeat(2, 1fr);
            }
            .kpi-matrix-row {
                grid-template-columns: repeat(2, 1fr);
            }
            .showcase-visual-frame {
                min-height: 240px;
                max-height: 280px;
            }
            .showcase-real-image {
                min-height: 240px;
                max-height: 280px;
            }
        }

        @media (max-width: 640px) {
            header.nav-hud {
                padding: 10px 14px;
                padding-top: calc(10px + env(safe-area-inset-top));
            }
            .nav-container {
                gap: 8px;
            }
            .brand-logo-ring {
                width: 36px;
                height: 36px;
                border-radius: var(--r-sm);
            }
            .brand-logo-ring svg {
                width: 18px;
                height: 18px;
            }
            .brand-title-text {
                font-size: 0.92rem;
                line-height: 1.2;
                gap: 4px;
            }
            .brand-course-chip {
                font-size: 0.62rem;
                padding: 1px 5px;
            }
            .brand-sub-text {
                display: none;
            }
            .nav-controls {
                gap: 6px;
            }
            #nt {
                padding: 8px 10px;
                min-width: 38px;
                height: 38px;
                font-size: 0.8rem;
            }
            #nt span {
                display: none;
            }
            #sfx-toggle, #theme-toggle {
                width: 38px;
                height: 38px;
                min-width: 38px;
                padding: 0;
            }

            main.main-viewport {
                padding: 12px 10px 32px;
                padding-bottom: calc(32px + env(safe-area-inset-bottom));
            }
            .cyber-card {
                padding: 18px 14px;
                border-radius: 16px;
            }

            /* Home Stage */
            .hero-stage {
                padding: 18px 14px;
                gap: 16px;
                border-radius: 16px;
            }
            .hero-live-badge {
                font-size: 0.7rem;
                padding: 4px 10px;
                margin-bottom: 10px;
            }
            .hero-headline {
                font-size: 1.5rem;
                line-height: 1.24;
                margin-bottom: 10px;
            }
            .hero-description {
                font-size: 0.86rem;
                line-height: 1.5;
                margin-bottom: 16px;
            }
            .student-gateway-form {
                gap: 10px;
                width: 100%;
            }
            .cyber-input {
                font-size: 16px;
                padding: 12px 14px 12px 38px;
                height: 46px;
            }
            .input-prefix-icon {
                left: 12px;
            }
            #go {
                width: 100%;
                height: 46px;
                font-size: 0.95rem;
                justify-content: center;
                margin-top: 4px;
            }
            .showcase-visual-frame {
                min-height: 175px;
                max-height: 195px;
                height: 185px;
                border-radius: 14px;
                margin-top: 4px;
            }
            .showcase-real-image {
                min-height: 175px;
                max-height: 195px;
                height: 185px;
            }
            .showcase-glass-hud {
                padding: 8px 10px;
            }
            .hud-chip {
                font-size: 0.64rem;
                padding: 2px 6px;
            }
            .hud-title {
                font-size: 0.78rem;
                font-weight: 700;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .hud-subtitle {
                display: none;
            }

            /* Feature Matrix */
            .feature-matrix {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
                margin-top: 14px;
            }
            .matrix-tile {
                padding: 10px 10px;
                gap: 8px;
                border-radius: 12px;
            }
            .tile-icon-hex {
                width: 32px;
                height: 32px;
                min-width: 32px;
                font-size: 1rem;
            }
            .matrix-tile b {
                font-size: 0.84rem;
            }
            .matrix-tile span {
                font-size: 0.7rem;
            }

            /* Quiz Questions & Options */
            .quiz-hud-layout {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .question-stage-card {
                padding: 16px 12px;
                border-radius: 16px;
            }
            .gauge-telemetry {
                margin-bottom: 8px;
            }
            .unit-topic-tag {
                font-size: 0.7rem;
                padding: 3px 8px;
                max-width: 62%;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .timer-digital-readout {
                font-size: 0.84rem;
                padding: 3px 8px;
            }
            .gauge-track {
                height: 6px;
                margin-bottom: 12px;
            }
            .question-prompt-text {
                font-size: 1.05rem;
                line-height: 1.4;
                margin-bottom: 16px;
            }
            .options-deck {
                gap: 9px;
            }
            .opt-card-btn {
                padding: 12px 10px;
                gap: 10px;
                border-radius: 12px;
                font-size: 0.88rem;
                line-height: 1.35;
                min-height: 50px;
            }
            .opt-key-hex {
                width: 28px;
                height: 28px;
                min-width: 28px;
                font-size: 0.76rem;
                border-radius: 6px;
            }
            .opt-text-payload {
                font-size: 0.88rem;
            }
            .stage-footer-actions {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
                padding-top: 10px;

    <script>
        /* ==========================================================================

        const SUPABASE_URL = "https://bdmwcdokbptuohkccefe.supabase.co";
        const SUPABASE_KEY = "sb_publishable_hnsOA4Qx_nJy5Uh3E6lz9g_MqenVkYB";
        const API = "https://script.google.com/macros/s/AKfycbwbNmwbPJ6Wc8WGBa8zFffCaP4xYJi-__9Uq5Yw0qA9cZM_7FzYvyiIQMcGTXKAKuWr/exec";

        const TITLE = "Surprise Quiz · CO4 Decentralized Generation";
        const INSTRUCTOR_NAME = "Dr. K Balamurugan";

        // Supabase Client Initialization
        let supabase = null;
        try {
            if (window.supabase) {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            }
        } catch (e) {
            console.warn("Supabase initialization error:", e);
        }

        // Default Question Bank
        const DEF = [
            ["________ is the primary purpose of a power grid in an electrical supply system.", "To transmit and distribute electrical power to consumers|To store electrical energy permanently|To replace all decentralized generation systems|To generate electricity only from renewable sources", 0],
            ["DG stands for in the context of rural electrification ____________.", "Distribution Grid|Direct Generation|Digital Grid|Distributed Generation", 3],
            ["____ of the following is identified as a service-delivery option for rural electrification.", "Nuclear transmission system|Independent micro-grid with local generation|Centralized battery grid only|Underground generation grid", 1],
            ["______ factor is considered important for selecting a decentralized generation technology.", "Local resource availability|Colour of distribution poles|Number of substations in a city|Height of consumer buildings", 0],
            ["______ of the following is a key characteristic of an independent Microgrid.", "It depends completely on a distant transmission network|It provides local generation and distribution|It can operate only with nuclear power|It does not require any distribution network", 1],
            ["_____ of the following is a major factor influencing the cost of decentralized generation.", "Number of street lights only|Transformer paint colour|Plant Load Factor|Pole height only", 2],
            ["Renewable energy source is identified in the module as a suitable option for DG in areas with hydro potential is ______.", "Diesel|Micro-hydro|Coal|Nuclear power", 1],
            ["Why is tariff sustainability important for decentralized generation projects?", "It supports recovery of project operating costs and promotes long-term viability|It eliminates the need for generation|It increases transmission losses|It prevents local participation", 0],
            ["______ can independent micro-grids be suitable for remote rural areas.", "They always have zero operating cost|They require no local energy resources|They eliminate all consumer loads|Grid extension may be technically difficult or expensive", 3],
            ["A rural area has good grid penetration, but the quality and reliability of grid supply are poor. _______ approach is most appropriate.", "DG with grid backup|Individual home systems only in every village|Remove the existing distribution network|Increase the distance from the grid", 0]
        ].map(([q, o, a]) => ({ q, o: o.split("|"), a }));

        const $ = s => document.querySelector(s);
        const app = $("#app");
        const L = "ABCD";
        const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

        let Q = DEF.slice();
        let S = null;
        let pw = sessionStorage.getItem("pw") || "";
        let audioEnabled = localStorage.getItem("quiz_sound") !== "off";

        /* ==========================================================================
           AUDIO SYNTHESIZER ENGINE
           ========================================================================== */
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) audioCtx = new AudioContextClass();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playSound(type) {
            if (!audioEnabled) return;
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                const now = ctx.currentTime;

                if (type === 'correct') {
                    const osc1 = ctx.createOscillator();
                    const osc2 = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc1.type = 'sine';
                    osc2.type = 'triangle';
                    osc1.frequency.setValueAtTime(523.25, now);
                    osc1.frequency.exponentialRampToValueAtTime(659.25, now + 0.12);
                    osc2.frequency.setValueAtTime(783.99, now + 0.1);
                    osc2.frequency.exponentialRampToValueAtTime(1046.50, now + 0.28);
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
                    osc1.connect(gain);
                    osc2.connect(gain);
                    gain.connect(ctx.destination);
                    osc1.start(now);
                    osc2.start(now + 0.08);
                    osc1.stop(now + 0.35);
                    osc2.stop(now + 0.45);
                } else if (type === 'wrong') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.linearRampToValueAtTime(146, now + 0.28);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'tick') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, now);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'streak') {
                    [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.07);
                        gain.gain.setValueAtTime(0.14, now + idx * 0.07);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.25);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + idx * 0.07);
                        osc.stop(now + idx * 0.07 + 0.25);
                    });
                }
            } catch (err) {}
        }

        /* Sound SFX UI Toggle */
        function updateSfxButton() {

                btn.title = "Sound effects: OFF";
            }
        }
        $("#sfx-toggle").onclick = () => {
            audioEnabled = !audioEnabled;
            localStorage.setItem("quiz_sound", audioEnabled ? "on" : "off");
            updateSfxButton();
            if (audioEnabled) playSound('correct');
        };
        updateSfxButton();

        /* Theme Toggle (Dark / Light) */
        const savedTheme = localStorage.getItem("quiz_theme") || "dark";
        document.documentElement.setAttribute("data-theme", savedTheme);
        function updateThemeIcon() {
            const isDark = document.documentElement.getAttribute("data-theme") === "dark";
            $("#theme-icon").innerHTML = isDark 
                ? `<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>`
                : `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>`;
        }
        $("#theme-toggle").onclick = () => {
            const current = document.documentElement.getAttribute("data-theme");
            const next = current === "dark" ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", next);
            localStorage.setItem("quiz_theme", next);
            updateThemeIcon();
        };
        updateThemeIcon();

        /* Toast Notifications */
        const toast = m => {
            const t = $("#toast");
            t.innerHTML = `<span>⚡</span> <span>${m}</span>`;
            t.className = "on";
            setTimeout(() => t.className = "", 2800);
        };

        /* Confetti Burst */
        function triggerConfetti() {
            for (let i = 0; i < 90; i++) {
                const e = document.createElement("div");
                e.className = "confetti-piece";
                e.style.left = Math.random() * 100 + "vw";
                e.style.background = ["#ffb703", "#00f2fe", "#10b981", "#8b5cf6", "#fb8500", "#ff0055"][i % 6];

                e.style.animationDuration = (2.2 + Math.random() * 1.5) + "s";
                document.body.appendChild(e);
                setTimeout(() => e.remove(), 4200);
            }
        }

        /* ==========================================================================
           API & CLOUD DATABASE CLIENT (SUPABASE + LOCAL STORAGE)
           ========================================================================== */
        async function api(payload) {
            const getStorage = k => JSON.parse(localStorage.getItem(k) || "null");

            // 1. Fetch Questions
            if (payload.action === "questions") {
                if (supabase) {
                    try {
                        const { data, error } = await supabase.from("quiz_questions").select("*").order("id", { ascending: true });
                        if (!error && data && data.length) {
                            return { qs: data.map(d => d.data || d) };
                        }
                    } catch (_) {}
                }
                if (API) {
                    try {
                        const r = await fetch(API, { method: "POST", body: JSON.stringify(payload) });
                        const res = await r.json();
                        if (res && res.qs && res.qs.length) return res;
                    } catch (_) {}
                }
                return { qs: getStorage("qs") || [] };
            }

            // 2. Submit Assessment Result
            if (payload.action === "submit") {
                const results = getStorage("rs") || [];
                const item = {
                    email: payload.email || "-",
                    name: payload.name,
                    reg: payload.reg,
                    score: payload.score,
                    total: payload.total,
                    points: payload.points,
                    time: new Date().toISOString()
                };
                results.unshift(item);
                localStorage.setItem("rs", JSON.stringify(results));

                let sbSaved = false;
                let sbError = null;

                if (supabase) {
                    try {
                        const sbRow = {
                            email: payload.email || "-",
                            name: payload.name,
                            reg: payload.reg,
                            score: payload.score,
                            total: payload.total,
                            points: payload.points,
                            created_at: new Date().toISOString()
                        };
                        const sbRes1 = await supabase.from("quiz_results").insert([sbRow]);
                        if (!sbRes1.error) {
                            sbSaved = true;
                        } else {
                            console.warn("quiz_results insert note:", sbRes1.error);
                            const sbRes2 = await supabase.from("results").insert([sbRow]);
                            if (!sbRes2.error) {
                                sbSaved = true;
                            } else {
                                sbError = sbRes1.error.message || sbRes2.error.message;
                            }
                        }
                    } catch (err) {
                        console.warn("Supabase submit caught:", err);
                        sbError = err.message;
                    }
                }

                if (API) {
                    try {
                        fetch(API, { method: "POST", body: JSON.stringify(payload) }).catch(() => {});
                    } catch (_) {}
                }

                return { ok: true, supabase: sbSaved, error: sbError };
            }

            // 3. Faculty Sign-in Verification
            const allowed = ["admin123", "ChangeMe123", "admin", "balamurugan", "eee"];
            if (!allowed.includes(payload.password)) {
                if (API) {
                    try {
                        const r = await fetch(API, { method: "POST", body: JSON.stringify(payload) });
                        return await r.json();
                    } catch (_) {}
                }
                return { error: "Invalid Instructor Password" };
            }

            // 4. Save Question Bank
            if (payload.action === "save") {
                localStorage.setItem("qs", JSON.stringify(payload.qs));
                if (supabase) {
                    try {
                        await supabase.from("quiz_questions").delete().neq("id", 0);
                        await supabase.from("quiz_questions").insert(payload.qs.map((q, idx) => ({ id: idx + 1, data: q })));
                    } catch (_) {}
                }
                if (API) {
                    try {
                        fetch(API, { method: "POST", body: JSON.stringify(payload) }).catch(() => {});
                    } catch (_) {}
                }
                return { ok: true };
            }

            // 5. Fetch Submissions for Instructor Command Portal
            if (payload.action === "results") {
                let rows = [];
                let fromSupabase = false;

                if (supabase) {
                    try {
                        let sbRes = await supabase.from("quiz_results").select("*").order("created_at", { ascending: false });
                        if (sbRes.error || !sbRes.data || !sbRes.data.length) {
                            sbRes = await supabase.from("results").select("*").order("created_at", { ascending: false });
                        }
                        if (!sbRes.error && sbRes.data && sbRes.data.length) {
                            fromSupabase = true;
                            rows = sbRes.data.map(r => ({
                                time: r.created_at || r.time || new Date().toISOString(),
                                email: r.email || "-",
                                name: r.name,
                                reg: r.reg || r.roll,
                                score: r.score,
                                total: r.total,
                                points: r.points,
                                source: "supabase"
                            }));
                        }
                    } catch (e) {
                        console.warn("Supabase fetch results warning:", e);
                    }
                }

                // Merge or fallback to local storage
                const localRows = getStorage("rs") || [];
                if (!rows.length) {
                    rows = localRows.map(r => ({
                        ...r,
                        email: r.email || "-",
                        source: "local"
                    }));
                } else {
                    localRows.forEach(lr => {
                        const exists = rows.some(r => r.reg === lr.reg && (r.email === lr.email || r.time === lr.time));
                        if (!exists) {
                            rows.unshift({ ...lr, email: lr.email || "-", source: "local" });
                        }
                    });
                }

                return { rows, fromSupabase };
            }

            return { ok: true };
        }

        /* ==========================================================================
           WORD (.DOCX) QUESTION PARSER
           ========================================================================== */
        function parseQuizText(rawText) {
            if (!rawText) return [];
            const lines = rawText.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
            const questions = [];
            let cur = null;

            const isQuestionStart = line => /^(\d+[\.\)]|Question\s*\d+[:\.]?|Q\d+[:\.]?|\[\d+\])\s+/i.test(line);
            const isAnswerLine = line => /^(Ans(?:wer)?|Correct(?:\s*Option|\s*Answer)?|Key)\s*[:\-\=\.]?\s*[\(\[]?([A-Da-d1-4])/i.test(line);

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];

                const ansMatch = line.match(isAnswerLine);
                if (ansMatch) {
                    if (cur) {
                        const rawKey = ansMatch[2].toUpperCase();
                        let ansIdx = 'ABCD'.indexOf(rawKey);
                        if (ansIdx < 0 && ['1', '2', '3', '4'].includes(rawKey)) {
                            ansIdx = parseInt(rawKey, 10) - 1;
                        }
                        if (ansIdx >= 0) cur.a = ansIdx;
                    }
                    continue;
                }

                if (isQuestionStart(line)) {
                    if (cur && cur.q && cur.o && cur.o.length >= 2) {
                        while (cur.o.length < 4) cur.o.push("Option " + "ABCD"[cur.o.length]);
                        questions.push(cur);
                    }
                    const qClean = line.replace(/^(\d+[\.\)]|Question\s*\d+[:\.]?|Q\d+[:\.]?|\[\d+\])\s+/i, '').trim();
                    cur = { q: qClean, o: [], a: 0 };
                    continue;
                }

                const optMatch = line.match(/^(\*?)\s*[\(\[]?([A-Da-d1-4])[\)\]\.\:]\s*(.*?)(?:\s*\*|\s*\[correct\]|\s*\(correct\))?$/i);
                if (optMatch && cur) {
                    const hasStar = optMatch[1] === '*' || /\*|\[correct\]|\(correct\)/i.test(line);
                    const optText = optMatch[3].trim();
                    cur.o.push(optText);
                    if (hasStar) cur.a = cur.o.length - 1;
                    continue;
                }

                if (cur) {
                    if (cur.o.length > 0) cur.o[cur.o.length - 1] += ' ' + line;
                    else cur.q += ' ' + line;
                }
            }

            if (cur && cur.q && cur.o && cur.o.length >= 2) {
                while (cur.o.length < 4) cur.o.push("Option " + "ABCD"[cur.o.length]);
                questions.push(cur);
            }

            return questions;
        }

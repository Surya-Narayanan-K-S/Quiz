                        box.style.color = "#166534";
                    } else if (error.code === "PGRST205") {
                        box.innerHTML = `<span>⚠</span> <span><b>Table not created yet:</b> Supabase project reachable, but <code>quiz_results</code> table does not exist in schema. Copy the SQL code below and run it in the Supabase SQL Editor!</span>`;
                        box.style.background = "#fffbeb";
                        box.style.borderColor = "#fde68a";
                        box.style.color = "#92400e";
                    } else {
                        box.innerHTML = `<span>⚠</span> <span>Connected to Supabase. Response note: ${esc(error.message || JSON.stringify(error))}</span>`;
                        box.style.background = "#fffbeb";
                        box.style.borderColor = "#fde68a";
                        box.style.color = "#92400e";
                    }
                } catch (err) {
                    box.innerHTML = `<span>⚠</span> <span>Connection note: ${esc(err.message)}</span>`;
                    box.style.background = "#fffbeb";
                    box.style.borderColor = "#fde68a";
                    box.style.color = "#92400e";
                }
            };

            $("#btn-sync-local").onclick = async () => {
                const local = JSON.parse(localStorage.getItem("rs") || "[]");
                if (!local.length) {
                    return toast("No local submissions found to sync");
                }
                toast(`Pushing ${local.length} local records to Supabase…`);
                let pushed = 0;
                for (const item of local) {
                    try {
                        const { error } = await supabase.from('quiz_results').insert([{
                            email: item.email || '-',
                            name: item.name,
                            reg: item.reg,
                            score: item.score,
                            total: item.total,
                            points: item.points,
                            created_at: item.time || new Date().toISOString()
                        }]);
                        if (!error) pushed++;
                    } catch (_) {}
                }
                toast(`✔ Synced ${pushed} records with Supabase!`);
                await dash();
            };
        }

        async function saveQuestionsToCloud() {
            const res = await api({ action: "save", password: pw, qs: Q });
            toast(res && res.error ? res.error : "✔ Questions synced with Google Sheet");
        }

        /* Question Editor Tab */
        function renderQuestionEditor() {
            $("#tb").innerHTML = `
            <div style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--r-md);padding:22px;margin-bottom:24px;display:flex;flex-direction:column;gap:12px;">
                <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
                    <div style="font-family:var(--font-head);font-size:1.1rem;font-weight:800;">
                        ${ed >= 0 ? `Edit Question #${ed + 1}` : 'Add New Question'}
                    </div>
                    <button class="btn btn-secondary btn-sm" id="btn-goto-docx" style="border:1px dashed var(--gold);">
                        📄 Upload Word (.docx) File
                    </button>
                </div>

                <textarea id="qt" class="cyber-input" rows="2" placeholder="Question statement"></textarea>
                
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                    ${[0, 1, 2, 3].map(k => `
                        <input id="o${k}" class="cyber-input" placeholder="Option ${L[k]}">
                    `).join("")}
                </div>

                <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:4px;">
                    <select id="ca" class="cyber-input" style="width:auto;padding:10px 14px;">
                        ${[0, 1, 2, 3].map(k => `
                            <option value="${k}">Correct Answer: ${L[k]}</option>
                        `).join("")}
                    </select>

                    <button class="btn btn-primary btn-sm" id="ad">
                        ${ed >= 0 ? 'Update Question' : 'Add to Bank'}
                    </button>
                    ${ed >= 0 ? `<button class="btn btn-secondary btn-sm" id="can">Cancel</button>` : ''}
                    <button class="btn btn-secondary btn-sm" id="rs" style="margin-left:auto;">
                        Reset to Default 10 Questions
                    </button>
                </div>
            </div>

            <div id="ql"></div>
            `;

            $("#btn-goto-docx").onclick = () => {
                tab = "d";
                draw();
            };

            $("#ql").innerHTML = Q.map((item, i) => `
                <div style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--r-md);padding:18px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:14px;">
                    <div>
                        <b style="font-family:var(--font-head);font-size:1.05rem;">${i + 1}.</b> ${esc(item.q)}
                        <div style="font-size:0.84rem;color:var(--ok-light);margin-top:4px;font-weight:600;">
                            ✔ Correct: Option ${L[item.a]}) ${esc(item.o[item.a])}
                        </div>
                    </div>
                    <div style="display:flex;gap:8px;flex-shrink:0;">
                        <button class="btn btn-secondary btn-sm" data-e="${i}">Edit</button>
                        <button class="btn btn-secondary btn-sm" data-d="${i}" style="color:var(--bad-light);">Delete</button>
                    </div>
                </div>
            `).join("");

            if (ed >= 0) {
                const target = Q[ed];
                $("#qt").value = target.q;
                target.o.forEach((opt, k) => $("#o" + k).value = opt);
                $("#ca").value = target.a;
                $("#can").onclick = () => { ed = -1; renderQuestionEditor(); };
            }

            document.querySelectorAll("[data-e]").forEach(btn => {
                btn.onclick = () => {
                    ed = +btn.dataset.e;
                    renderQuestionEditor();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };
            });

            document.querySelectorAll("[data-d]").forEach(btn => {
                btn.onclick = async () => {
                    if (confirm(`Delete question #${+btn.dataset.d + 1}?`)) {
                        Q.splice(+btn.dataset.d, 1);
                        ed = -1;
                        await saveQuestionsToCloud();
                        renderQuestionEditor();
                    }
                };
            });

            $("#ad").onclick = async () => {
                const qText = $("#qt").value.trim();
                const opts = [0, 1, 2, 3].map(k => $("#o" + k).value.trim());
                if (!qText || opts.some(o => !o)) {
                    toast("Please fill in question text and all 4 options");
                    return;
                }
                const newQ = { q: qText, o: opts, a: +$("#ca").value };
                if (ed >= 0) {
                    Q[ed] = newQ;
                } else {
                    Q.push(newQ);
                }
                ed = -1;
                await saveQuestionsToCloud();
                renderQuestionEditor();
            };

            $("#rs").onclick = async () => {
                if (confirm("Restore the original 10 questions from course syllabus?")) {
                    Q = DEF.slice();
                    ed = -1;
                    await saveQuestionsToCloud();
                    renderQuestionEditor();
                }
            };
        }

        /* Word (.docx) Import Tab */
        function renderDocxImportTab() {
            $("#tb").innerHTML = `
            <div style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--r-md);padding:24px;display:flex;flex-direction:column;gap:14px;">
                <div>
                    <h3 style="font-family:var(--font-head);font-size:1.25rem;font-weight:900;">📄 Import Questions from Word Document (.docx)</h3>
                    <p style="font-size:0.86rem;color:var(--ink-dim);margin-top:3px;">
                        Upload your MS Word (.docx) file or paste text directly. The AI parser extracts questions, 4 options (A-D), and correct answer keys automatically.
                    </p>
                </div>

                <!-- Drag & Drop Zone -->
                <div class="dropzone-cyber-box" id="docx-dropzone">
                    <input type="file" id="docx-file-input" accept=".docx,.doc,.txt" style="display:none;">
                    <div class="dropzone-icon-orb">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    </div>
                    <b style="font-family:var(--font-head);font-size:1.1rem;color:var(--ink);">Click to upload or drag &amp; drop Word (.docx) file</b>
                    <span style="font-size:0.82rem;color:var(--ink-dim);">Accepts Microsoft Word (.docx), .doc, or .txt question papers</span>
                </div>

                <!-- Text Paste Dropdown -->
                <details style="background:var(--bg);padding:14px;border-radius:var(--r-sm);border:1px solid var(--border);">
                    <summary style="cursor:pointer;font-family:var(--font-head);font-weight:700;font-size:0.92rem;color:var(--gold);user-select:none;">
                        📋 Or paste text copied directly from Word
                    </summary>
                    <div style="margin-top:12px;display:flex;flex-direction:column;gap:10px;">
                        <textarea id="paste-doc-text" class="cyber-input" rows="6" placeholder="Example format:
1. What is the primary purpose of a power grid?
A. Transmit and distribute electrical power
B. Store electrical energy permanently
C. Replace decentralized generation
D. Generate from renewables only
Answer: A"></textarea>
                        <button class="btn btn-secondary btn-sm" id="btn-parse-pasted" style="align-self:flex-start;">
                            ⚡ Parse Pasted Text
                        </button>
                    </div>
                </details>

                <div id="docx-preview-wrap"></div>
            </div>
            `;

            const dropzone = $("#docx-dropzone");
            const fileInput = $("#docx-file-input");

            dropzone.onclick = () => fileInput.click();

            dropzone.ondragover = e => {
                e.preventDefault();
                dropzone.classList.add("dragover");
            };
            dropzone.ondragleave = () => dropzone.classList.remove("dragover");
            dropzone.ondrop = e => {
                e.preventDefault();
                dropzone.classList.remove("dragover");
                if (e.dataTransfer.files.length) {
                    handleWordFile(e.dataTransfer.files[0]);
                }
            };

            fileInput.onchange = e => {
                if (e.target.files.length) {
                    handleWordFile(e.target.files[0]);
                }
            };

            $("#btn-parse-pasted").onclick = () => {
                const text = $("#paste-doc-text").value.trim();
                if (!text) return toast("Paste quiz text first");
                const parsed = parseQuizText(text);
                if (!parsed.length) {
                    toast("Could not recognize questions. Check format (e.g. 1. Question... A. Option... Answer: A)");
                    return;
                }
                stagedDocxQuestions = parsed;
                showStagedPreview("Pasted Word Text");
            };

            if (stagedDocxQuestions.length) {
                showStagedPreview("Loaded Questions");
            }
        }

        function handleWordFile(file) {
            toast("Reading " + file.name + "…");
            const reader = new FileReader();

            if (file.name.toLowerCase().endsWith(".docx")) {
                reader.onload = function(e) {
                    const arrayBuffer = e.target.result;
                    if (window.mammoth) {
                        window.mammoth.extractRawText({ arrayBuffer: arrayBuffer })
                            .then(function(result) {
                                const text = result.value;
                                const parsed = parseQuizText(text);
                                if (!parsed.length) {
                                    toast("No questions found in " + file.name + ". Try checking format.");
                                    return;
                                }
                                stagedDocxQuestions = parsed;
                                showStagedPreview(file.name);
                            })
                            .catch(function(err) {
                                console.error(err);
                                toast("Error parsing .docx: " + err.message);
                            });
                    } else {
                        toast("Mammoth parser loading, retry in a moment");
                    }
                };
                reader.readAsArrayBuffer(file);
            } else {
                reader.onload = function(e) {
                    const text = e.target.result;
                    const parsed = parseQuizText(text);
                    if (!parsed.length) {
                        toast("No questions found in file.");
                        return;
                    }
                    stagedDocxQuestions = parsed;
                    showStagedPreview(file.name);
                };
                reader.readAsText(file);
            }
        }

        function showStagedPreview(sourceName) {
            const wrap = $("#docx-preview-wrap");
            if (!wrap) return;

            wrap.innerHTML = `
            <div style="margin-top:24px;border-top:1px solid var(--border);padding-top:20px;">
                <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px;">
                    <div>
                        <b style="font-family:var(--font-head);font-size:1.15rem;color:var(--ok-light);">✅ Extracted ${stagedDocxQuestions.length} Questions from "${esc(sourceName)}"</b>
                        <div style="font-size:0.84rem;color:var(--ink-dim);margin-top:2px;">Review below before deploying to the live quiz.</div>
                    </div>
                    <div style="display:flex;gap:10px;flex-wrap:wrap;">
                        <button class="btn btn-primary btn-sm" id="btn-apply-replace">
                            ⚡ Make this the Live Quiz (${stagedDocxQuestions.length} Questions)
                        </button>
                        <button class="btn btn-secondary btn-sm" id="btn-apply-append">
                            ➕ Append to Current Bank
                        </button>
                        <button class="btn btn-secondary btn-sm" id="btn-clear-staged" style="color:var(--bad-light);">
                            ✕ Clear
                        </button>
                    </div>
                </div>

                <div class="doc-staging-list">
                    ${stagedDocxQuestions.map((item, idx) => `
                        <div class="doc-staged-card">
                            <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;">
                                <b style="font-family:var(--font-head);font-size:1rem;">${idx + 1}. ${esc(item.q)}</b>
                                <button class="btn btn-secondary btn-sm" data-rem="${idx}" style="color:var(--bad-light);padding:4px 8px;">✕</button>
                            </div>
                            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:0.88rem;color:var(--ink-dim);margin-top:4px;">
                                ${item.o.map((opt, oIdx) => `
                                    <div style="padding:7px 12px;border-radius:6px;background:var(--bg);border:1px solid ${oIdx === item.a ? 'var(--ok)' : 'var(--border)'};color:${oIdx === item.a ? 'var(--ok-light)' : 'inherit'};">
                                        <b>${L[oIdx]}.</b> ${esc(opt)} ${oIdx === item.a ? '✔ (Correct)' : ''}
                                    </div>
                                `).join("")}
                            </div>
                            <div style="display:flex;align-items:center;gap:10px;margin-top:6px;font-size:0.84rem;">
                                <span>Change Correct Answer:</span>
                                <select data-chans="${idx}" class="cyber-input" style="width:auto;padding:5px 12px;font-size:0.84rem;">
                                    ${[0, 1, 2, 3].map(k => `
                                        <option value="${k}" ${k === item.a ? 'selected' : ''}>${L[k]}</option>
                                    `).join("")}
                                </select>
                            </div>
                        </div>
                    `).join("")}
                </div>
            </div>
            `;

            document.querySelectorAll("[data-chans]").forEach(sel => {
                sel.onchange = () => {
                    const qIdx = +sel.dataset.chans;
                    stagedDocxQuestions[qIdx].a = +sel.value;
                    showStagedPreview(sourceName);
                };
            });

            document.querySelectorAll("[data-rem]").forEach(btn => {
                btn.onclick = () => {
                    const qIdx = +btn.dataset.rem;
                    stagedDocxQuestions.splice(qIdx, 1);
                    showStagedPreview(sourceName);
                };
            });

            $("#btn-clear-staged").onclick = () => {
                stagedDocxQuestions = [];
                wrap.innerHTML = "";
            };

            $("#btn-apply-replace").onclick = async () => {
                if (!stagedDocxQuestions.length) return toast("No questions to apply");
                if (confirm(`Replace the active quiz with these ${stagedDocxQuestions.length} questions from Word doc?`)) {
                    Q = stagedDocxQuestions.slice();
                    await saveQuestionsToCloud();
                    stagedDocxQuestions = [];
                    toast(`✔ Active quiz updated with ${Q.length} questions!`);
                    tab = "q";
                    draw();
                }
            };

            $("#btn-apply-append").onclick = async () => {
                if (!stagedDocxQuestions.length) return toast("No questions to append");
                Q = Q.concat(stagedDocxQuestions);
                await saveQuestionsToCloud();
                stagedDocxQuestions = [];
                toast(`✔ Added questions! Total now: ${Q.length}`);
                tab = "q";
                draw();
            };
        }

        // Initialize portal
        init();
    </script>
</body>
</html>
